name: "ABBA2 — Action 3: Render Low-Quality & Polish"

on:
  workflow_dispatch:
    inputs:
      force_repolish:
        description: "Force re-polish even if perfect code already exists"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  render-and-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (LaTeX + Manim deps)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            texlive-full \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            python3-dev \
            build-essential

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install manim requests cryptography

      - name: Force clear perfect code (if requested)
        if: ${{ github.event.inputs.force_repolish == 'true' }}
        run: |
          echo "# ABBA 2 — Current Perfect Code" > state/current_perfect_code.py
          echo "# Empty — no polished code ready." >> state/current_perfect_code.py
          echo "[Setup] Force cleared current_perfect_code.py"

      - name: Check unpolished code state
        id: check_code
        run: |
          CODE_CONTENT=$(cat state/current_unpolished_code.py | grep -v "^#" | tr -d '[:space:]')
          if [ -z "$CODE_CONTENT" ]; then
            echo "code_ready=false" >> $GITHUB_OUTPUT
            echo "ERROR: current_unpolished_code.py is empty — run Action 2 first!"
          else
            echo "code_ready=true" >> $GITHUB_OUTPUT
            echo "Unpolished code found — proceeding."
          fi

      - name: Check perfect code state
        id: check_perfect
        if: steps.check_code.outputs.code_ready == 'true'
        run: |
          PERF_CONTENT=$(cat state/current_perfect_code.py | grep -v "^#" | tr -d '[:space:]')
          if [ -n "$PERF_CONTENT" ]; then
            echo "perfect_exists=true" >> $GITHUB_OUTPUT
            echo "Perfect code already exists — skipping."
          else
            echo "perfect_exists=false" >> $GITHUB_OUTPUT
            echo "No perfect code yet — proceeding with render & polish."
          fi

      - name: Render low-quality video and polish with Kie.ai Gemini
        if: |
          steps.check_code.outputs.code_ready == 'true' &&
          steps.check_perfect.outputs.perfect_exists == 'false'
        run: |
          cd scripts
          python action3_render_and_polish.py
        env:
          PYTHONPATH: "${{ github.workspace }}/scripts"

      - name: Upload low-quality video as artifact (for inspection)
        if: |
          steps.check_code.outputs.code_ready == 'true' &&
          steps.check_perfect.outputs.perfect_exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: low-quality-render-${{ github.run_id }}
          path: /tmp/manim_render/output_low_quality.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Commit polished code and voiceover JSON
        if: |
          steps.check_code.outputs.code_ready == 'true' &&
          steps.check_perfect.outputs.perfect_exists == 'false'
        run: |
          git config --local user.email "abba2-bot@github-actions"
          git config --local user.name "ABBA2 Bot"
          git add state/current_perfect_code.py state/current_voiceover.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "✨ [Action3] Polished code + voiceover ready $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        run: |
          echo "## ABBA2 Action 3 Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PERFECT_SIZE=$(wc -c < state/current_perfect_code.py || echo 0)
          VO_SIZE=$(wc -c < state/current_voiceover.json || echo 0)
          echo "- Perfect code size: ${PERFECT_SIZE} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- Voiceover JSON size: ${VO_SIZE} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- Low-quality video uploaded as GitHub Actions artifact" >> $GITHUB_STEP_SUMMARY
          echo "- Next step: Run **Action 4 — High Quality Render & Upload** workflow" >> $GITHUB_STEP_SUMMARY
