name: "ABBA2 — Action 2: Generate Manim Code"

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Force regeneration even if code file is not empty"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  generate-code:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Force clear unpolished code (if requested)
        if: ${{ github.event.inputs.force_regenerate == 'true' }}
        run: |
          echo "# ABBA 2 — Current Unpolished Code" > state/current_unpolished_code.py
          echo "# Empty — no code in progress." >> state/current_unpolished_code.py
          echo "[Setup] Force cleared current_unpolished_code.py"

      - name: Check lesson state
        id: check_lesson
        run: |
          if [ ! -s state/current_lesson.txt ] || [ "$(cat state/current_lesson.txt | tr -d '[:space:]')" = "" ]; then
            echo "lesson_ready=false" >> $GITHUB_OUTPUT
            echo "ERROR: current_lesson.txt is empty — run Action 1 first!"
          else
            echo "lesson_ready=true" >> $GITHUB_OUTPUT
            echo "Lesson found — proceeding to code generation."
          fi

      - name: Check code state
        id: check_code
        if: steps.check_lesson.outputs.lesson_ready == 'true'
        run: |
          CODE_CONTENT=$(cat state/current_unpolished_code.py | grep -v "^#" | tr -d '[:space:]')
          if [ -n "$CODE_CONTENT" ]; then
            echo "code_exists=true" >> $GITHUB_OUTPUT
            echo "Code file already has content — skipping generation."
          else
            echo "code_exists=false" >> $GITHUB_OUTPUT
            echo "Code file is empty — proceeding with generation."
          fi

      - name: Generate Manim code via v0.app
        if: |
          steps.check_lesson.outputs.lesson_ready == 'true' &&
          steps.check_code.outputs.code_exists == 'false'
        run: |
          cd scripts
          python action2_generate_code.py
        env:
          PYTHONPATH: "${{ github.workspace }}/scripts"

      - name: Commit code to repository
        if: |
          steps.check_lesson.outputs.lesson_ready == 'true' &&
          steps.check_code.outputs.code_exists == 'false'
        run: |
          git config --local user.email "abba2-bot@github-actions"
          git config --local user.name "ABBA2 Bot"
          git add state/current_unpolished_code.py
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "⚙️ [Action2] Generated Manim code $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        run: |
          echo "## ABBA2 Action 2 Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          CODE_SIZE=$(wc -c < state/current_unpolished_code.py || echo 0)
          echo "- Code file size: ${CODE_SIZE} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- Next step: Run **Action 3 — Render & Polish** workflow" >> $GITHUB_STEP_SUMMARY
