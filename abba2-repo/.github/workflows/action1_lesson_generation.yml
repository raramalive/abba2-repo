name: "ABBA2 — Action 1: Generate Lesson"

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Force regeneration even if current_lesson.txt is not empty"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  generate-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Force clear current lesson (if requested)
        if: ${{ github.event.inputs.force_regenerate == 'true' }}
        run: |
          echo "" > state/current_lesson.txt
          echo "[Setup] Force cleared current_lesson.txt"

      - name: Check current lesson state
        id: check_state
        run: |
          if [ -s state/current_lesson.txt ] && [ "$(cat state/current_lesson.txt | tr -d '[:space:]')" != "" ]; then
            echo "lesson_exists=true" >> $GITHUB_OUTPUT
            echo "Current lesson file is NOT empty — skipping generation."
          else
            echo "lesson_exists=false" >> $GITHUB_OUTPUT
            echo "Current lesson file is empty — proceeding with generation."
          fi

      - name: Generate lesson via v0.app
        if: steps.check_state.outputs.lesson_exists == 'false'
        run: |
          cd scripts
          python action1_generate_lesson.py
        env:
          PYTHONPATH: "${{ github.workspace }}/scripts"

      - name: Commit lesson to repository
        if: steps.check_state.outputs.lesson_exists == 'false'
        run: |
          git config --local user.email "abba2-bot@github-actions"
          git config --local user.name "ABBA2 Bot"
          git add state/current_lesson.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🎓 [Action1] Generated new lesson $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        run: |
          echo "## ABBA2 Action 1 Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          LESSON_SIZE=$(wc -c < state/current_lesson.txt || echo 0)
          echo "- Lesson file size: ${LESSON_SIZE} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- Next step: Run **Action 2 — Generate Code** workflow" >> $GITHUB_STEP_SUMMARY
