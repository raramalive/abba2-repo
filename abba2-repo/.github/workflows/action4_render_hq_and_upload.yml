name: "ABBA2 — Action 4: High Quality Render & Upload"

on:
  workflow_dispatch:
    inputs:
      skip_voiceover:
        description: "Skip voiceover generation (faster for testing)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  render-hq-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (LaTeX + Manim + ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            texlive-full \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config \
            python3-dev \
            build-essential

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install manim requests cryptography google-auth google-auth-httplib2 google-api-python-client

      - name: Check perfect code state
        id: check_perfect
        run: |
          PERF_CONTENT=$(cat state/current_perfect_code.py | grep -v "^#" | tr -d '[:space:]')
          if [ -z "$PERF_CONTENT" ]; then
            echo "perfect_ready=false" >> $GITHUB_OUTPUT
            echo "ERROR: current_perfect_code.py is empty — run Action 3 first!"
            exit 1
          else
            echo "perfect_ready=true" >> $GITHUB_OUTPUT
            echo "Perfect code found — proceeding with high quality render."
          fi

      - name: Skip voiceover if requested
        if: ${{ github.event.inputs.skip_voiceover == 'true' }}
        run: |
          echo "[]" > state/current_voiceover.json
          echo "[Setup] Voiceover generation skipped by user request."

      - name: Render high quality, generate voiceover, and upload to Google Drive
        if: steps.check_perfect.outputs.perfect_ready == 'true'
        run: |
          cd scripts
          python action4_render_hq_and_upload.py
        env:
          PYTHONPATH: "${{ github.workspace }}/scripts"

      - name: Upload high-quality video as GitHub Actions artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_id }}
          path: /tmp/manim_render_hq/assets/*.mp4
          retention-days: 30
          if-no-files-found: warn

      - name: Upload voiceover audio as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-audio-${{ github.run_id }}
          path: /tmp/manim_render_hq/assets/*.mp3
          retention-days: 30
          if-no-files-found: warn

      - name: Commit cleared state files back to repo
        if: steps.check_perfect.outputs.perfect_ready == 'true'
        run: |
          git config --local user.email "abba2-bot@github-actions"
          git config --local user.name "ABBA2 Bot"
          git add state/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "🏁 [Action4] Lesson complete — state archived + cleared $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        run: |
          echo "## ABBA2 Action 4 Complete 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ High quality video rendered" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Voiceover generated (unless skipped)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Files uploaded to Google Drive 'JESUS' folder" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lesson archived to former_lessons.txt" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ State cleared — ready for next lesson" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "Run **Action 1 — Generate Lesson** to begin the next lesson." >> $GITHUB_STEP_SUMMARY
